# Local development / Oracle VPS testing
# Usage: docker compose up --build
#
# Copy .env.example → .env and fill in your credentials before running.

services:
  recorder:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "8080:8080"       # health-check: http://localhost:8080/health
    volumes:
      - recorder-data:/data
    healthcheck:
      test: ["CMD", "node", "-e",
             "require('http').get('http://localhost:8080/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  recorder-data:
    driver: local
